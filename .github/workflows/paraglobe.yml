# Paraglobe: runs each pull request in Paraglobe and posts the result as one comment.
#
# Copy this file to .github/workflows/paraglobe.yml in the repository it tests and set the two
# lines under `env:`. That is the whole integration: no other file goes with it.
#
# This workflow only transports. It sends the pull request's tree to Paraglobe over SSH and posts
# the comment Paraglobe sends back, verbatim, with the check's outcome. It judges nothing and
# contains nothing of how Paraglobe works: the comment arrives finished.
#
# Repository secrets (secrets, never variables: Actions prints variables in its logs, and the logs
# of a public repository are readable by anyone signed in to GitHub):
#   PARAGLOBE_CI_KEY        the key this repository uses to reach Paraglobe (this repository's own;
#                           Paraglobe accepts it for this repository's world and no other)
#   PARAGLOBE_BOX_HOST      Paraglobe's address
#   PARAGLOBE_KNOWN_HOSTS   Paraglobe's SSH host key
#
# `pull_request` deliberately, not `pull_request_target`: a pull request opened from a fork of this
# repository gets no secrets, so it cannot reach Paraglobe at all.
name: Paraglobe

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One run per pull request; a new push supersedes the one in flight.
concurrency:
  group: paraglobe-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  PARAGLOBE_WORLD: trainticket
  PARAGLOBE_SUITE: api
  # Paths the run does not need (tar --exclude arguments); none here.
  PARAGLOBE_TAR_EXCLUDE: ""

jobs:
  paraglobe:
    name: Paraglobe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: List the changed paths
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            fs.mkdirSync('.paraglobe', { recursive: true });
            fs.writeFileSync('.paraglobe/changed-files', files.map(f => f.filename).join('\n') + '\n');
            fs.writeFileSync('.paraglobe/head-sha', context.payload.pull_request.head.sha + '\n');
            core.info(`${files.length} changed path(s)`);

      - name: Send the pull request to Paraglobe
        id: send
        env:
          BOX_HOST: ${{ secrets.PARAGLOBE_BOX_HOST }}
          KNOWN_HOSTS: ${{ secrets.PARAGLOBE_KNOWN_HOSTS }}
          CI_KEY: ${{ secrets.PARAGLOBE_CI_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Secrets are masked already; the address is masked again in case an ssh error names it.
          # The host key is written to a file and never echoed.
          echo "::add-mask::$BOX_HOST"
          test -n "$BOX_HOST"    || { echo "secrets.PARAGLOBE_BOX_HOST is not set"; exit 1; }
          test -n "$KNOWN_HOSTS" || { echo "secrets.PARAGLOBE_KNOWN_HOSTS is not set"; exit 1; }
          test -n "$CI_KEY"      || { echo "secrets.PARAGLOBE_CI_KEY is not set (a pull request from a fork gets no secrets)"; exit 1; }
          key="$RUNNER_TEMP/paraglobe_ci"; umask 077
          printf '%s\n' "$CI_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          # PR_NUMBER and HEAD_SHA reach the shell through the environment, never interpolated.
          # Keepalives hold the connection open while the run waits its turn. Paraglobe's own
          # progress output is kept out of this public log (it goes to a file only it reads back).
          rc=0
          # shellcheck disable=SC2086  # PARAGLOBE_TAR_EXCLUDE is a list of --exclude arguments
          tar --exclude-vcs $PARAGLOBE_TAR_EXCLUDE -czf - . \
            | ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o LogLevel=ERROR \
                  -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
                  -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
                  ci@"$BOX_HOST" "$PARAGLOBE_WORLD $PR_NUMBER $HEAD_SHA $PARAGLOBE_SUITE" \
            > "$RUNNER_TEMP/paraglobe.json" 2> "$RUNNER_TEMP/paraglobe.stderr" || rc=$?
          echo "reply=$RUNNER_TEMP/paraglobe.json" >> "$GITHUB_OUTPUT"
          echo "stderr=$RUNNER_TEMP/paraglobe.stderr" >> "$GITHUB_OUTPUT"
          echo "ssh_rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
        continue-on-error: true

      # The key and the host key are the job's alone: gone before any later step, whatever happened.
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/paraglobe_ci" "$RUNNER_TEMP/known_hosts"

      # The report page, when Paraglobe sent one with the reply: attached to this workflow run, where
      # only people who can read this repository can open it, and removed by GitHub after 30 days.
      - name: Unpack the report
        id: report
        env:
          REPLY: ${{ steps.send.outputs.reply }}
        run: |
          python3 - "$REPLY" "$RUNNER_TEMP/paraglobe-report.html" >> "$GITHUB_OUTPUT" <<'PY'
          import base64, gzip, json, sys
          try:
              page = json.load(open(sys.argv[1])).get("report") or ""
              if page:
                  open(sys.argv[2], "wb").write(gzip.decompress(base64.b64decode(page)))
          except Exception:
              page = ""
          print("has=" + ("true" if page else "false"))
          PY
        continue-on-error: true

      - name: Attach the report
        id: upload
        if: steps.report.outputs.has == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          path: ${{ runner.temp }}/paraglobe-report.html
          archive: false
          retention-days: 30
        continue-on-error: true

      # Posts what Paraglobe sent back: {marker, body, conclusion, failure}. When nothing usable
      # came back, it says so -- the connection, Paraglobe, or the reply -- and the check fails.
      # The comment's report line points at the attachment, or is left out when there is none.
      - name: Post the comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          REPLY: ${{ steps.send.outputs.reply }}
          STDERR: ${{ steps.send.outputs.stderr }}
          SSH_RC: ${{ steps.send.outputs.ssh_rc }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const world = process.env.PARAGLOBE_WORLD;
            let reply = null, kind = null;
            try {
              const raw = fs.readFileSync(process.env.REPLY, 'utf8');
              if (!raw.trim()) throw new Error('empty');
              reply = JSON.parse(raw);
              if (reply.schema !== 'paraglobe.comment/1' || typeof reply.body !== 'string') { reply = null; kind = 'reply'; }
            } catch (e) {
              kind = Number(process.env.SSH_RC || 0) === 255 ? 'connection' : (e.message === 'empty' ? 'Paraglobe' : 'reply');
            }
            if (!reply) {
              // The run id is the first line Paraglobe writes, so a failed run can still be traced.
              let run = '';
              try { const m = fs.readFileSync(process.env.STDERR, 'utf8').replace(/\x1b\[[0-9;]*m/g, '').match(/==> run (\S+) on/); if (m) run = m[1]; } catch (e) { /* none */ }
              const marker = `<!-- paraglobe-ci:${world} -->`;
              const sha = context.payload.pull_request.head.sha.slice(0, 12);
              reply = { marker, conclusion: 'failure', failure: `the run did not complete (${kind})`,
                body: `**Paraglobe · \`${world}\` · ⚠️ run did not complete: ${kind}**${run ? ` · run \`${run}\`` : ''}\n\n` +
                      `No result for \`${sha}\`; nothing is claimed about this pull request.\n\n${marker}` };
            }
            const placeholder = 'https://paraglobe.invalid/report';
            if (reply.body.includes(placeholder)) {
              const url = process.env.REPORT_URL || '';
              reply.body = url ? reply.body.split(placeholder).join(url)
                               : reply.body.split('\n').filter(l => !l.includes(placeholder)).join('\n').replace(/\n{3,}/g, '\n\n');
            }
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(reply.marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: reply.body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: reply.body });
            }
            await core.summary.addRaw(reply.body).write();
            if (reply.conclusion !== 'success') core.setFailed(reply.failure || 'Paraglobe: failed');
